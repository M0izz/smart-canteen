apiVersion: apps/v1
kind: Deployment
metadata: {name: smart-canteen, namespace: smart-canteen}
spec:
  replicas: 2
  selector: {matchLabels: {app: smart-canteen}}
  template:
    metadata: {labels: {app: smart-canteen}}
    spec:
      containers:
      - name: app
        image: smart-canteen:latest
        ports: [{containerPort: 5000}]
        readinessProbe: {httpGet: {path: /health, port: 5000}}
        livenessProbe: {httpGet: {path: /health, port: 5000}}
