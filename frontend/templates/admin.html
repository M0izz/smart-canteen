<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Operations | Smart Canteen</title>
	<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
	<nav><b>SMART CANTEEN</b><span class="nav-context">MAIN CANTEEN <span aria-hidden="true">/</span> OPERATIONS</span><button onclick="logout()">Log out</button></nav>
	<main class="container admin-dashboard">
		<header class="page-heading">
			<div><p class="eyebrow">CANTEEN OVERVIEW</p><h1>Operations</h1><p>Today's activity and recent system events.</p></div>
			<span class="service-pill"><span aria-hidden="true"></span> Live overview</span>
		</header>
		<section aria-labelledby="statsTitle">
			<div class="section-heading"><div><p class="eyebrow">AT A GLANCE</p><h2 id="statsTitle">Today's numbers</h2></div></div>
			<div class="stats-grid" id="stats" aria-live="polite"><p class="empty-state">Loading metrics...</p></div>
		</section>
		<section class="audit-section" aria-labelledby="auditTitle">
			<div class="section-heading"><div><p class="eyebrow">RECENT ACTIVITY</p><h2 id="auditTitle">Audit log</h2></div><span class="menu-count">Latest 100 events</span></div>
			<div class="audit-list" id="logs" aria-live="polite"><p class="empty-state">Loading activity...</p></div>
		</section>
	</main>
	<script src="/static/js/app.js"></script>
	<script>initAdmin()</script>
</body>
</html>
