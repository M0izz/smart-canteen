<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Sign In | Smart Canteen</title>
	<link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth">
	<main class="auth-wrap">
		<a class="auth-brand" href="/">SMART CANTEEN <span>· CAMPUS DINING</span></a>
		<section class="auth-card">
			<p class="eyebrow">WELCOME BACK</p>
			<h1>Sign in</h1>
			<p class="auth-intro">Pick up where your appetite left off.</p>
			<form id="loginForm">
				<label for="email">College email</label>
				<input id="email" name="email" type="email" placeholder="you@college.edu" autocomplete="username" required>
				<label for="password">Password</label>
				<input id="password" name="password" type="password" placeholder="Your password" autocomplete="current-password" required>
				<button class="btn auth-submit" id="loginSubmit" type="submit">Sign in</button>
			</form>
			<p id="msg" class="feedback" role="alert" aria-live="polite"></p>
			<div class="demo-access">
				<div class="section-heading"><h2>Demo access</h2><span>LOCAL PREVIEW</span></div>
				<div class="demo-grid">
					<button type="button" data-demo-email="admin@example.com" data-demo-password="Admin@123"><b>Admin</b><span>Open console</span></button>
					<button type="button" data-demo-email="staff@example.com" data-demo-password="Staff@123"><b>Staff</b><span>Open kitchen</span></button>
					<button type="button" data-demo-email="vrushali@example.com" data-demo-password="Student@123"><b>Student</b><span>Place an order</span></button>
				</div>
			</div>
			<p class="auth-foot">New to the canteen? <a href="/register">Create a student account</a></p>
		</section>
		<a class="auth-home" href="/">Back to canteen home</a>
	</main>
	<script src="/static/js/app.js"></script>
	<script>initAuthForms()</script>
</body>
</html>
